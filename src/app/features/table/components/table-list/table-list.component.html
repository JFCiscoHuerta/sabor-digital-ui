<div class="tables-container">
  <app-table-card *ngFor="let table of tables" [table]="table"></app-table-card>
</div>

<div class="pagination">
  <button mat-button (click)="changePages(page - 1)" [disabled]="page <= 0"><</button>
  <span> {{page + 1 }} / {{ totalPages }} </span>
  <button mat-button (click)="changePages(page + 1)" [disabled]="page >= totalPages - 1">></button>
</div>
