<mat-card class="waiter-card">
  <mat-card-header>
    <mat-card-title>{{ waiter.firstname }} {{ waiter.lastname }} </mat-card-title>
    <mat-card-subtitle> {{ waiter.email || 'No Email Registered' }} </mat-card-subtitle>
  </mat-card-header>

  <mat-card-content>
    <p><strong>Phone</strong> {{ waiter.phone }} </p>
    <p><strong>Asigned Tables:</strong> {{ waiter.tablesId?.length || 0 }} </p>
    <p><strong>Restaurant ID:</strong> {{  waiter.restaurantId}} </p>
  </mat-card-content>

  <mat-card-actions>
    <button mat-button color="primary" (click)="goToDetails()">Details</button>
  </mat-card-actions>

</mat-card>
